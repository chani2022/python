                    /date_naissance
                      *valeur_possible
                          ex: 01011952
                      *obligatoire
                          oui
                      *regle
                          formatage => Format AAAAMMJJ (AAAA : année, MM : mois, JJ : jour)
                                      Si la date est obligatoire, les règles de saisie sont :
                                      Si le jour est inconnu : « AAAAMM00 »
                                      Si le jour et le mois sont inconnus : « AAAA0000 »
                                      Si le mois est inconnu - non géré, seule valeur à saisir : « AAAA0000 »
                                      Si l’année est inconnue - non géré, seule valeur à saisir : « 10000101 »
                      *affichage
                          oui
