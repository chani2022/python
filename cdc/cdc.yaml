                    /numero_acte
                      *valeur_possible
                          ex: 1, 2, 1B, 1BIS
                      *obligatoire
                          oui
                      *regle
                          formatage => Numéro d’acte complété avec des zéros à gauche.
                                      S’il s’agit d’un acte Bis, le numéro doit être complété avec une lettre sans que le numéro complet ne dépasse la longueur de 6
                                      caractères (« 00001B », « 001BIS »)
                                      ex: 1 => 000001, 2 => 000002, 1B => 00001B, 1BIS => 001BIS
                      *affichage
                          oui
                    /code_etat
                      *valeur_possible
                          ex: 0:enfant 1:Père 2:Mère
                      *obligatoire
                          oui
                      *regle
                          formatage => En plus de la ligne de l'individu principal, 
                                      une ligne supplémentaire doit être ajoutée par personne faisant partie de la filiation
                                      en respectant l’ordre suivant :
                                        Actes de naissance, reconnaissance, décès et transcription :
                                          Ligne 1, code état «0» : enfant /défunt
                                          Ligne 2, code état «1» : père
                                          Ligne 3, code état «2» : mère
                                        Actes de mariage :
                                          Ligne 1, code état «0» : époux
                                          Ligne 2, code état «1» : père époux
                                          Ligne 3, code état «2» : mère époux
                                          Ligne 4, code état «0» : épouse
                                          Ligne 5, code état «1» : père épouse
                                          Ligne 6, code état «2» : mère épouse
                      *affichage
                          non

