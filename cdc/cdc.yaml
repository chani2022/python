                    /nom
                      *valeur_possible
                          ex: TEST
                      *obligatoire
                          oui
                      *regle
                          Les caractères accentués seront toujours indiqués en minuscules. Les caractères majuscules accentués sont à proscrire. 
                          Cette remarque est valable même s’il s’agit de la 1ère lettre du nom (IGREC 195).
                          Les caractères acceptés restent limités à ceux qui figurent dans la table ASCII.
                          Si le nom n’apparaît pas dans l’acte, cas de constat de décès, la valeur à indiquer par défaut est « X »
                          Dans certains cas les différents noms sont séparés par un caractère « espace » ou « - - » (adjonction de nom).
