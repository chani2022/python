                        *regle
                            Année du registre sur 4 chiffres.
                            Ensuite il peut comporter des chiffres ou des lettres non accentuées. 
                            Il ne peut pas dépasser 7 caractères (« 2000 », « 2000A », « 2000BIS »)
                            Majuscule
